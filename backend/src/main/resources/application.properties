# Application name
spring.application.name=MentR

# ==============================
# Database Configuration
# ==============================
# MySQL connection settings.
# DB_URL / DB_USERNAME / DB_PASSWORD are supplied via environment variables in
# production (or the gitignored backend/config/application.properties for
# local dev). The defaults below (after the ':') are only used when those
# env vars are unset, which preserves the exact current local dev setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mentr_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
# Never commit a real password here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
# update = Hibernate will create/update tables automatically based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT Configuration
# ==============================
# This is the secret key used to sign JWT tokens.
# Real value is supplied via the JWT_SECRET environment variable (or the
# gitignored backend/config/application.properties for local dev). Never
# commit a real secret here.
app.jwt.secret=${JWT_SECRET}
# Token expires in 24 hours (in milliseconds: 86400000)
app.jwt.expiration=86400000

# ==============================
# Server Configuration
# ==============================
server.port=8081

# ==============================
# CORS Configuration
# ==============================
# Allow requests from the React frontend
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004