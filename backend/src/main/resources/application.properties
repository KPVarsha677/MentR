# Application name
spring.application.name=MentR

# ==============================
# Database Configuration
# ==============================
# MySQL connection settings.
# DB_URL / DB_USERNAME / DB_PASSWORD are supplied via environment variables in
# production (or the gitignored backend/config/application.properties for
# local dev). The defaults below (after the ':') are only used when those
# env vars are unset, which preserves the exact current local dev setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mentr_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
# Never commit a real password here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
# update = Hibernate will create/update tables automatically based on entity classes
spring.jpa.hibernate.ddl-auto=update
# Logging every SQL statement (with bound values, at debug level) is a dev
# convenience only — on a shared deployment it bloats logs and can leak
# student data (names, register numbers, etc.) into log files. Off by default;
# re-enable locally via backend/config/application.properties if needed.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT Configuration
# ==============================
# This is the secret key used to sign JWT tokens.
# Real value is supplied via the JWT_SECRET environment variable (or the
# gitignored backend/config/application.properties for local dev). Never
# commit a real secret here.
app.jwt.secret=${JWT_SECRET}
# Token expires in 24 hours (in milliseconds: 86400000)
app.jwt.expiration=86400000

# ==============================
# Teacher Registration Gate
# ==============================
# Shared secret that must be supplied to register as ROLE_TEACHER. Without
# it, teacher registration is blocked entirely — nobody could otherwise
# self-register as a teacher and get access to every student's data. Set
# TEACHER_INVITE_CODE (env var, or the gitignored backend/config/application.properties
# for local dev) to a value you hand out to real faculty only.
app.teacher-invite-code=${TEACHER_INVITE_CODE:}

# ==============================
# Email Verification
# ==============================
# Where the frontend is hosted — used to build the link inside the
# verification email (e.g. https://your-frontend.com/verify-email?token=...).
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# SMTP settings for sending the verification email. Works with any standard
# SMTP provider (Gmail with an app password, SendGrid/Mailgun SMTP relay,
# etc.) — set these via env vars or the gitignored backend/config/application.properties
# for local dev. If SMTP_HOST is left unset, EmailService logs the
# verification link instead of sending it, so local dev works without any
# email credentials configured.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:MentR <no-reply@mentr.local>}

# ==============================
# Server Configuration
# ==============================
server.port=8081

# ==============================
# CORS Configuration
# ==============================
# Allow requests from the React frontend
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004