# Application name
spring.application.name=MentR

# ==============================
# Database Configuration
# ==============================
# PostgreSQL connection settings (e.g. Supabase).
# DB_URL / DB_USERNAME / DB_PASSWORD are supplied via environment variables in
# production (or the gitignored backend/config/application.properties for
# local dev). The defaults below (after the ':') are only used when those
# env vars are unset, and assume a local Postgres instance on the default port.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mentr_db}
spring.datasource.username=${DB_USERNAME:postgres}
# Never commit a real password here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
# update = Hibernate will create/update tables automatically based on entity classes
spring.jpa.hibernate.ddl-auto=update
# Logging every SQL statement (with bound values, at debug level) is a dev
# convenience only — on a shared deployment it bloats logs and can leak
# student data (names, register numbers, etc.) into log files. Off by default;
# re-enable locally via backend/config/application.properties if needed.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT Configuration
# ==============================
# This is the secret key used to sign JWT tokens.
# Real value is supplied via the JWT_SECRET environment variable (or the
# gitignored backend/config/application.properties for local dev). Never
# commit a real secret here.
app.jwt.secret=${JWT_SECRET}
# Token expires in 24 hours (in milliseconds: 86400000)
app.jwt.expiration=86400000

# ==============================
# Teacher Registration Gate
# ==============================
# Comma-separated allowlist of faculty email addresses permitted to
# register as ROLE_TEACHER. Without it, teacher registration is blocked
# entirely — nobody could otherwise self-register as a teacher and get
# access to every student's data. Matching is case-insensitive and ignores
# surrounding whitespace, so entries can be pasted freely; there's no limit
# on how many addresses this can hold. The department adds/removes faculty
# by editing APPROVED_TEACHER_EMAILS (env var, or the gitignored
# backend/config/application.properties for local dev) — no code change,
# no redeploy of code needed, just update the value.
#
# Example: APPROVED_TEACHER_EMAILS=teacher1@college.ac.in,teacher2@college.ac.in,teacher3@college.ac.in
app.approved-teacher-emails=${APPROVED_TEACHER_EMAILS:}

# Comma-separated allowlist of student email addresses permitted to register
# as ROLE_STUDENT. Same fail-closed behavior as the teacher allowlist above:
# an empty/unset list rejects every student registration.
app.approved-student-emails=${APPROVED_STUDENT_EMAILS:}

# ==============================
# Server Configuration
# ==============================
server.port=8081

# ==============================
# CORS Configuration
# ==============================
# Allow requests from the React frontend.
# Comma-separated list of allowed origins. Real value is supplied via the
# APP_CORS_ALLOWED_ORIGINS environment variable in production (or the
# gitignored backend/config/application.properties for local dev). The
# default below (after the ':') is only used when that env var is unset,
# and covers the local dev server ports.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004}